$kind: http-request
method: GET
url: '{{base_url}}/exercises/non_existent_exercise_999'
order: 4000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", function () {
        pm.response.to.have.status(404);
      });

      pm.test("Error detail explains missing exercise", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("detail");
      });
