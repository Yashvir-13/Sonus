$kind: http-request
method: GET
url: '{{base_url}}/exercises?instrument=guitar&difficulty=beginner'
order: 2000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function () {
        pm.expect(pm.response.json()).to.be.an("array");
      });

      pm.test("All returned exercises match filter criteria", function () {
        const json = pm.response.json();
        json.forEach(function (ex) {
          pm.expect(ex.instrument.toLowerCase()).to.eql("guitar");
          pm.expect(ex.difficulty.toLowerCase()).to.eql("beginner");
        });
      });
