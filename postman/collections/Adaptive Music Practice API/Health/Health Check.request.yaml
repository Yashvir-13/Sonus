$kind: http-request
method: GET
url: '{{base_url}}/health'
order: 500
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Service and database are healthy", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status", "healthy");
        pm.expect(json).to.have.property("database", "ok");
        pm.expect(json).to.have.property("timestamp");
      });
