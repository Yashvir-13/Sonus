$kind: http-request
method: POST
url: '{{base_url}}/me'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "username": "testuser123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 422", function () {
        pm.response.to.have.status(422);
      });

      pm.test("Response body contains error about user already existing", function () {
        const text = pm.response.text();
        pm.expect(text.toLowerCase()).to.satisfy(function (s) {
          return s.includes("already") || s.includes("exist") || s.includes("duplicate") || s.includes("conflict");
        });
      });
