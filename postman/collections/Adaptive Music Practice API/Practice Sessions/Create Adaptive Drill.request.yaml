$kind: http-request
method: POST
url: '{{base_url}}/sessions/{{session_id}}/drill'
order: 10000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Drill intervention has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("pattern_id");
        pm.expect(json).to.have.property("user_id");
        pm.expect(json).to.have.property("drill_type");
        pm.expect(json).to.have.property("target_tempo");
        pm.expect(json).to.have.property("target_repetitions");
        pm.expect(json).to.have.property("completed");
        pm.expect(json.completed).to.eql(false);
      });

      pm.test("Sets drill_id environment variable", function () {
        const json = pm.response.json();
        pm.environment.set("drill_id", json.id);
      });
