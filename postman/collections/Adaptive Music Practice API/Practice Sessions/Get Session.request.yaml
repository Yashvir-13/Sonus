$kind: http-request
method: GET
url: '{{base_url}}/sessions/{{session_id}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("user_id");
        pm.expect(json).to.have.property("exercise_id");
        pm.expect(json).to.have.property("state");
      });

      pm.test("id equals session_id env variable", function () {
        pm.expect(pm.response.json().id).to.eql(pm.environment.get("session_id"));
      });
