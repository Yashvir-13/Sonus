$kind: http-request
method: POST
url: '{{base_url}}/sessions'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "exercise_id": "{{exercise_id}}",
      "tempo_bpm": 80
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("user_id");
        pm.expect(json).to.have.property("exercise_id");
        pm.expect(json).to.have.property("tempo_bpm");
        pm.expect(json).to.have.property("state");
      });

      pm.test("state equals recording", function () {
        pm.expect(pm.response.json().state).to.eql("recording");
      });

      pm.test("tempo_bpm equals 80", function () {
        pm.expect(pm.response.json().tempo_bpm).to.eql(80);
      });

      if (pm.response.code === 201) {
        pm.environment.set("session_id", pm.response.json().id);
      }
