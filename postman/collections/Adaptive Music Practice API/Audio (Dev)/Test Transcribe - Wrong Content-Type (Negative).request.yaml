$kind: http-request
method: POST
url: '{{base_url}}/audio/test-transcribe'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 422", function () {
        pm.response.to.have.status(422);
      });

      pm.test("Response body contains multipart/form-data", function () {
        pm.expect(pm.response.text().toLowerCase()).to.include("multipart/form-data");
      });
