name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r pyproject.toml
          uv pip install pytest pytest-asyncio mypy

      - name: Run strict type checking
        run: uv run mypy src/ tests/

      - name: Run pytest test suite
        run: uv run pytest tests/ -v

  frontend:
    name: Frontend Vitest, Types & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest tests
        run: pnpm --filter web test

      - name: Type check and production build
        run: pnpm --filter web build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_key_for_ci
          VITE_API_BASE_URL: http://localhost:8000
