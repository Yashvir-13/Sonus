src = ["src"]
exclude = [
    "apps/**",
    "src/alembic/**",
    "docs/**",
    ".env",
    ".env.*",
]

[format]
docstring-code-format = true

[lint]
select = ["ALL"]
ignore = [
    "FA102",
    "INP001",
    "DTZ005",
    "DTZ007",
    "DTZ011",
    "FIX002",
    "FBT001",
    "FBT002",
    "COM812",
    "EM101",
    "EM102",
    "TRY003",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "CPY001",
    "C901",
    "D100",
    "D102",
    "D104",
    "D107",
    "RUF001",
    "RUF003",
    "TC001",
    "TC002",
    "TC003",
    "E501",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"src/lib/seed_data.py" = ["Q000"]
"scripts/**/*.py" = [
    "T201",
    "S603",
    "S604",
    "S607",
    "S104",
    "PLR2004",
    "E501",
    "ARG001",
]
